<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Start Agent — Pro UI with File Upload</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #FF416C 0%, #FF4B2B 100%);
            --bg-dark: #0d0d0d;
            --bg-sidebar: #121212;
            --text-main: #f5f5f5;
            --text-dim: #a0a0a0;
            --border: rgba(255, 255, 255, 0.08);
            --user-bubble: linear-gradient(135deg, #FF416C 0%, #FF4B2B 100%);
            --code-bg: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            height: 100%;
            position: fixed;
            left: -280px;
            top: 0;
            z-index: 3000;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid var(--border);
        }
        .sidebar.active { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.8); }

        .sidebar-header { padding: 30px 20px; text-align: center; }
        .sidebar-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.4rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            display: block;
        }

        .new-chat-btn {
            width: 90%; margin: 0 auto; padding: 14px; background: var(--primary-gradient);
            border: none; color: white; border-radius: 14px; cursor: pointer; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .history-list { flex: 1; overflow-y: auto; padding: 15px; }
        .history-item {
            padding: 12px 15px; color: var(--text-dim); border-radius: 12px; cursor: pointer;
            margin-bottom: 10px; font-size: 0.9rem; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.03); border: 1px solid transparent;
        }
        .history-item.active { background: rgba(255, 65, 108, 0.1); color: white; border-color: rgba(255, 65, 108, 0.3); }

        /* --- Main Content --- */
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }

        .navbar {
            height: 70px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; background: rgba(13, 13, 13, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); z-index: 100;
        }

        #chat-container {
            flex: 1; overflow-y: auto; padding: 20px 16px;
            display: flex; flex-direction: column; gap: 25px;
        }

        /* --- Message Bubbles --- */
        .message { max-width: 100%; display: flex; flex-direction: column; margin-bottom: 10px; }
        .user-message {
            align-self: flex-end; background: var(--user-bubble);
            padding: 12px 18px; border-radius: 20px 20px 4px 20px;
            max-width: 85%; font-size: 0.95rem; color: white;
        }
        .ai-message { align-self: flex-start; display: flex; gap: 12px; width: 100%; }
        .ai-avatar { 
            width: 35px; height: 35px; background: var(--primary-gradient); 
            border-radius: 10px; display: flex; align-items: center; justify-content: center; 
            color: white; flex-shrink: 0; font-size: 0.8rem; font-weight: bold;
        }
        .ai-content { flex: 1; min-width: 0; font-size: 1rem; color: #e0e0e0; line-height: 1.6; }

        /* Image Display in Chat */
        .chat-image {
            max-width: 250px; border-radius: 10px; margin-top: 8px; display: block;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- Code Block --- */
        .code-wrapper { background: var(--code-bg); border-radius: 12px; margin: 15px 0; border: 1px solid var(--border); overflow: hidden; }
        .code-header { background: #1a1a1a; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .code-lang { font-size: 0.75rem; color: #FF8811; text-transform: uppercase; font-weight: 700; }
        .code-btns { display: flex; gap: 8px; }
        .code-btn { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); 
            color: #ddd; padding: 6px 10px; border-radius: 6px; font-size: 0.7rem; 
            cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s;
        }
        .code-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        
        pre { padding: 15px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #d4d4d4; line-height: 1.5; }

        /* --- Input Area --- */
        .input-wrapper { padding: 10px 16px 25px; background: var(--bg-dark); }
        #file-preview-container { max-width: 900px; margin: 0 auto 10px auto; display: none; background: #1a1a1a; padding: 10px; border-radius: 12px; border: 1px solid var(--border); }
        .preview-img-wrapper { position: relative; width: 60px; height: 60px; }
        .preview-img-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .remove-file { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .input-box { background: #181818; border: 1px solid var(--border); border-radius: 24px; display: flex; align-items: flex-end; padding: 8px 15px; max-width: 900px; margin: 0 auto; gap: 10px; }
        textarea { flex: 1; background: transparent; border: none; outline: none; padding: 10px 5px; font-size: 1rem; color: white; max-height: 150px; resize: none; }
        .icon-btn { background: transparent; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; padding: 8px; }
        .send-btn { background: var(--primary-gradient); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; border: none; }

        /* Preview Modal */
        #preview-modal { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; }
        .preview-header { padding: 15px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        
        .settings-drawer { position: fixed; bottom: -100%; left: 0; width: 100%; background: #121212; border-top: 1px solid var(--border); padding: 30px; z-index: 4000; transition: 0.5s ease; border-radius: 25px 25px 0 0; }
        .settings-drawer.active { bottom: 0; }

        #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--primary-gradient); color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.8rem; z-index: 9999; display: none; }
    </style>
</head>
<body>

    <div id="toast">Message</div>
    <div id="overlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; z-index:2500; backdrop-filter:blur(5px);" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">START AGENT</span>
            <button class="new-chat-btn" onclick="createNewChat()">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
        </div>
        <div class="history-list" id="history-list"></div>
        <div style="padding: 20px; border-top: 1px solid var(--border);">
            <div class="history-item" onclick="toggleSettings()"><i class="fa-solid fa-gear"></i> Settings</div>
        </div>
    </aside>

    <div class="main-content">
        <header class="navbar">
            <div onclick="toggleSidebar()"><i class="fa-solid fa-bars-staggered" style="color:#FF4B2B; font-size:1.3rem; cursor:pointer;"></i></div>
            <div style="font-weight: 700; color:#FF4B2B;">START AGENT</div>
            <div onclick="toggleSettings()"><i class="fa-solid fa-sliders" style="color:var(--text-dim); cursor:pointer;"></i></div>
        </header>

        <main id="chat-container"></main>

        <div class="input-wrapper">
            <div id="file-preview-container">
                <div class="preview-img-wrapper">
                    <img id="preview-img" src="" alt="preview">
                    <div class="remove-file" onclick="clearFile()"><i class="fa-solid fa-xmark"></i></div>
                </div>
            </div>

            <div class="input-box">
                <input type="file" id="file-input" hidden accept="image/*" onchange="handleFileSelect(event)">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <textarea id="user-input" placeholder="Ask or upload image..." rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
                <button class="send-btn" onclick="handleSend()"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal">
        <div class="preview-header">
            <span style="color:white; font-weight:bold;">Live Preview</span>
            <button onclick="document.getElementById('preview-modal').style.display='none'" style="background:red; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">Close</button>
        </div>
        <iframe id="preview-frame" style="flex:1; border:none; background:white;"></iframe>
    </div>

    <!-- Settings -->
    <div id="settings-drawer" class="settings-drawer">
        <h3 style="color:white; margin-bottom:15px;">Settings</h3>
        <input type="password" id="api-key" placeholder="OpenRouter API Key" style="width:100%; padding:14px; margin-bottom:12px; border-radius:10px; border:1px solid var(--border); background:#0d0d0d; color:white; outline:none;">
        <input type="text" id="model-name" value="google/gemini-2.0-flash-exp:free" style="width:100%; padding:14px; margin-bottom:20px; border-radius:10px; border:1px solid var(--border); background:#0d0d0d; color:white; outline:none;">
        <button onclick="saveSettings()" style="width:100%; padding:15px; background:var(--primary-gradient); color:white; border:none; border-radius:12px; font-weight:bold;">Save</button>
    </div>

    <script>
        let conversations = JSON.parse(localStorage.getItem('sa_history')) || [];
        let currentChatId = null;
        let settings = JSON.parse(localStorage.getItem('sa_settings')) || { key: '', model: 'google/gemini-2.0-flash-exp:free' };
        let selectedFileData = null;

        function init() {
            renderHistory();
            if (conversations.length > 0) loadChat(conversations[0].id);
            else createNewChat();
            document.getElementById('api-key').value = settings.key;
            document.getElementById('model-name').value = settings.model;
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                selectedFileData = { full: e.target.result };
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('file-preview-container').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function clearFile() {
            selectedFileData = null;
            document.getElementById('file-input').value = '';
            document.getElementById('file-preview-container').style.display = 'none';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('active') ? 'block' : 'none';
        }

        function toggleSettings() { document.getElementById('settings-drawer').classList.toggle('active'); }

        function createNewChat() {
            currentChatId = Date.now();
            conversations.unshift({ id: currentChatId, title: 'New Chat', messages: [] });
            saveToLocal(); renderHistory(); displayChat(conversations[0]);
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = conversations.find(c => c.id === id);
            displayChat(chat); renderHistory();
            if(window.innerWidth < 768) toggleSidebar();
        }

        function displayChat(chat) {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            if (chat.messages.length === 0) appendToUI('assistant', "I'm ready! Send me a message or a photo.");
            else chat.messages.forEach(msg => appendToUI(msg.role, msg.content, msg.image));
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            conversations.forEach(chat => {
                const item = document.createElement('div');
                item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerHTML = `<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${chat.title}</span>`;
                item.onclick = () => loadChat(chat.id);
                list.appendChild(item);
            });
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !selectedFileData) return;
            if (!settings.key) { alert("Add API Key in Settings!"); toggleSettings(); return; }

            const chat = conversations.find(c => c.id === currentChatId);
            if (chat.messages.length === 0) chat.title = text ? text.substring(0, 25) : "Image Chat";

            const userMsg = { role: 'user', content: text, image: selectedFileData ? selectedFileData.full : null };
            appendToUI('user', text, userMsg.image);
            chat.messages.push(userMsg);
            
            const apiMessages = chat.messages.map(m => {
                if(m.role === 'user' && m.image) {
                    return { role: 'user', content: [{type:'text', text: m.content || ""}, {type:'image_url', image_url: {url: m.image}}] };
                }
                return { role: m.role, content: m.content };
            });

            input.value = ''; clearFile();
            const thinkingId = appendThinking();

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${settings.key}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ "model": settings.model, "messages": apiMessages })
                });
                const data = await response.json();
                document.getElementById(thinkingId).remove();
                const aiText = data.choices[0].message.content;
                appendToUI('assistant', aiText);
                chat.messages.push({ role: 'assistant', content: aiText });
                saveToLocal();
            } catch (e) {
                document.getElementById(thinkingId).innerText = "Error: Check API Key.";
            }
        }

        function appendToUI(role, content, imageUrl = null) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `message ${role === 'user' ? 'user-message' : 'ai-message'}`;
            let html = role === 'assistant' ? `<div class="ai-avatar">SA</div><div class="ai-content">` : '';
            if (imageUrl) html += `<img src="${imageUrl}" class="chat-image" onclick="window.open(this.src)">`;
            if (content) html += role === 'assistant' ? enhanceCodeBlocks(marked.parse(content)) : `<div>${content}</div>`;
            if (role === 'assistant') html += `</div>`;
            div.innerHTML = html;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function enhanceCodeBlocks(h) {
            const d = document.createElement('div'); d.innerHTML = h;
            d.querySelectorAll('pre').forEach(pre => {
                const code = pre.querySelector('code'); if (!code) return;
                const lang = (code.className.match(/language-(\w+)/) || [, 'code'])[1];
                const wrap = document.createElement('div'); wrap.className = 'code-wrapper';
                wrap.innerHTML = `<div class="code-header">
                    <span class="code-lang">${lang}</span>
                    <div class="code-btns">
                        <button class="code-btn" onclick="copyCode(this)"><i class="fa-solid fa-copy"></i> Copy</button>
                        <button class="code-btn" onclick="downloadCode(this)"><i class="fa-solid fa-download"></i> Save</button>
                        <button class="code-btn" onclick="runPreview(this)"><i class="fa-solid fa-play"></i> Run</button>
                    </div>
                </div>`;
                const nPre = document.createElement('pre'); nPre.appendChild(code.cloneNode(true));
                wrap.appendChild(nPre); pre.replaceWith(wrap);
            });
            return d.innerHTML;
        }

        function copyCode(btn) {
            const code = btn.closest('.code-wrapper').querySelector('code').innerText;
            navigator.clipboard.writeText(code); showToast("Copied!");
        }

        function downloadCode(btn) {
            const code = btn.closest('.code-wrapper').querySelector('code').innerText;
            const lang = btn.closest('.code-wrapper').querySelector('.code-lang').innerText.toLowerCase();
            const extension = lang === 'javascript' ? 'js' : lang === 'python' ? 'py' : lang === 'html' ? 'html' : lang === 'css' ? 'css' : 'txt';
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `code_${Date.now()}.${extension}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Downloading...");
        }

        function runPreview(btn) {
            const code = btn.closest('.code-wrapper').querySelector('code').innerText;
            const modal = document.getElementById('preview-modal');
            modal.style.display = 'flex';
            const frame = document.getElementById('preview-frame');
            const doc = `<html><head><style>body{font-family:sans-serif;padding:20px;}</style></head><body>${code}</body></html>`;
            frame.srcdoc = doc;
        }

        function appendThinking() {
            const id = 't-' + Date.now();
            const div = document.createElement('div');
            div.className = 'message ai-message'; div.id = id;
            div.innerHTML = `<div class="ai-avatar">SA</div><div class="ai-content">Thinking...</div>`;
            document.getElementById('chat-container').appendChild(div);
            return id;
        }

        function saveSettings() {
            settings.key = document.getElementById('api-key').value;
            settings.model = document.getElementById('model-name').value;
            localStorage.setItem('sa_settings', JSON.stringify(settings));
            toggleSettings(); showToast("Saved!");
        }

        function saveToLocal() { localStorage.setItem('sa_history', JSON.stringify(conversations)); }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }

        init();
    </script>
</body>
</html>
